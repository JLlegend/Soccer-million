<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071329" />
    <meta name="description" content="A family soccer practice challenge tracker." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="backgrounds.css" />
    <title>Soccer Million Challenge</title>
  </head>
  <body class="theme-0">
    <main class="app-shell">
      <a class="admin-link" href="admin.html" aria-label="Parent admin">Parent</a>
      <section class="hero" aria-live="polite">
        <div class="ball" aria-hidden="true">⚽</div>
        <p class="eyebrow">SOCCER MILLION CHALLENGE</p>
        <p id="totalShots" class="total">0</p>
        <p class="label">TOTAL SHOTS</p>
      </section>

      <section class="status-grid" aria-label="Challenge progress">
        <article class="glass-card level-card">
          <p class="card-label">LEVEL <span id="levelNumber">1</span></p>
          <h1 id="levelName">Beginner</h1>
        </article>
        <article class="glass-card next-card">
          <p class="card-label">NEXT LEVEL</p>
          <p><strong id="nextLevelName">Rookie</strong> · <strong id="shotsRemaining">10,000</strong> shots to go</p>
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        </article>
      </section>

      <section class="streak glass-card">
        <span aria-hidden="true">🔥</span>
        <div><strong id="streakDays">0 Day Streak</strong><p>Keep the momentum going.</p></div>
      </section>

      <section class="achievements" aria-labelledby="achievementsHeading">
        <p id="achievementsHeading" class="eyebrow">ACHIEVEMENTS</p>
        <div id="badges" class="badge-row"></div>
      </section>
    </main>
    <p id="connectionStatus" class="connection-status">Loading challenge…</p>
    <script type="module" src="app.js"></script>
  </body>
</html>
